<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Ledger — Simple Expense Tracker</title>
    <meta
      name="description"
      content="Ledger is a simple, fast expense tracker. Log spending in seconds and see what's left in each budget."
    />
    <meta name="color-scheme" content="light dark" />

    <!-- Warm up connections to Firebase before the JS bundle asks for them -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />

    <!-- Icons & install -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ledger" />
    <meta name="application-name" content="Ledger" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="theme-color"
      content="#f5f5f7"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#000000"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ledger" />
    <meta property="og:title" content="Ledger — Simple Expense Tracker" />
    <meta
      property="og:description"
      content="Log spending in seconds and see what's left in each budget."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Splash shown until data loads; inline so it paints before any CSS/JS.
         src/components/LoadingScreen.tsx renders the same markup. -->
    <style>
      .splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f5f7;
      }
      .splash-icon {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        box-shadow: 0 6px 20px -6px rgba(0, 122, 255, 0.45);
        animation: splash-breathe 1.6s ease-in-out infinite;
      }
      @keyframes splash-breathe {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.94); opacity: 0.82; }
      }
      @media (prefers-color-scheme: dark) {
        .splash { background: #000; }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-icon { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status" aria-label="Loading your budgets">
        <img class="splash-icon" src="/favicon.svg" alt="" />
      </div>
    </div>
    <noscript>Ledger needs JavaScript enabled to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
